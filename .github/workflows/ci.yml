name: CI

# CI del backend — lint + typecheck + tests (unit + integration con Postgres real).
# Trigger: PR hacia develop o main, push directo a develop.
# Refs: RUNBOOK-LOCAL-001, CLAUDE.md §3.
#
# Guard: hasta que exista pyproject.toml (primeras issues de scaffolding),
# todos los jobs corren en no-op — evita que el CI falle en rojo antes de
# que el proyecto tenga código Python.

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.11'

jobs:

  # ── Lint + typecheck ─────────────────────────────────────────────────────────
  quality:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Skip si el proyecto aún no está scaffoldeado
        id: guard
        run: |
          if [ ! -f pyproject.toml ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "Proyecto sin scaffolding todavía — CI en no-op"
          fi

      - name: Set up Python
        if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: 'pyproject.toml'

      - name: Install dependencies
        if: steps.guard.outputs.skip != 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff lint
        if: steps.guard.outputs.skip != 'true'
        run: ruff check src tests

      - name: Ruff format check
        if: steps.guard.outputs.skip != 'true'
        run: ruff format --check src tests

      - name: Mypy type-check
        if: steps.guard.outputs.skip != 'true'
        run: mypy src
        continue-on-error: true  # mypy progresivo; no bloquea CI hasta tipado completo

  # ── Tests unitarios ──────────────────────────────────────────────────────────
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - name: Skip si el proyecto aún no está scaffoldeado
        id: guard
        run: |
          if [ ! -f pyproject.toml ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "Proyecto sin scaffolding todavía — CI en no-op"
          fi

      - name: Set up Python
        if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: 'pyproject.toml'

      - name: Install dependencies
        if: steps.guard.outputs.skip != 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run unit tests
        if: steps.guard.outputs.skip != 'true'
        # --cov-fail-under=0 overrides pyproject.toml's coverage gate: this job
        # only exercises tests/unit, so its own coverage is always well under
        # the global threshold. The real threshold is enforced on combined
        # coverage by coverage-gate.
        run: pytest tests/unit -v --cov=src/adminprop --cov-report=xml --cov-report=term-missing --cov-fail-under=0
        env:
          APP_ENV: test
          PYTHONDONTWRITEBYTECODE: 1
          COVERAGE_FILE: .coverage.unit

      - name: Upload coverage
        if: always() && steps.guard.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-unit
          include-hidden-files: true
          path: |
            .coverage.unit
            coverage.xml

  # ── Tests de integración (Postgres real) ──────────────────────────────────────
  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest
    needs: quality

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: adminprop
          POSTGRES_PASSWORD: adminprop
          POSTGRES_DB: adminprop_test
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
        ports:
          - 6379:6379

    env:
      APP_ENV: test
      DEBUG: 'false'
      SECRET_KEY: test-secret-key-not-used-in-real-crypto
      DATABASE_URL: postgresql+psycopg2://adminprop:adminprop@localhost:5432/adminprop_test
      DATABASE_POOL_SIZE: '5'
      REDIS_URL: redis://localhost:6379/0
      JWT_PRIVATE_KEY_PATH: ./keys/private.pem
      JWT_PUBLIC_KEY_PATH: ./keys/public.pem
      JWT_ACCESS_TOKEN_EXPIRE_HOURS: '8'
      JWT_REFRESH_TOKEN_EXPIRE_DAYS: '30'
      RESEND_API_KEY: re_fake-for-tests
      CORS_ORIGINS: 'http://localhost:5173'
      LOG_LEVEL: WARNING

    steps:
      - uses: actions/checkout@v4

      - name: Skip si aún no hay tests de integración
        id: guard
        run: |
          if [ ! -f pyproject.toml ] || [ -z "$(find tests/integration -name 'test_*.py' -print -quit 2>/dev/null)" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "Sin tests de integración todavía — job en no-op (llegan con los módulos de negocio)"
          fi

      - name: Set up Python
        if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: 'pyproject.toml'

      - name: Install dependencies
        if: steps.guard.outputs.skip != 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Generate JWT test keys
        if: steps.guard.outputs.skip != 'true'
        run: |
          mkdir -p keys
          openssl genrsa -out keys/private.pem 2048
          openssl rsa -in keys/private.pem -pubout -out keys/public.pem

      - name: Install Postgres extensions
        if: steps.guard.outputs.skip != 'true'
        run: |
          PGPASSWORD=adminprop psql -h localhost -U adminprop -d adminprop_test -c "CREATE EXTENSION IF NOT EXISTS pgcrypto;"
          PGPASSWORD=adminprop psql -h localhost -U adminprop -d adminprop_test -c "\dx"

      - name: Create adminprop_app and adminprop_superadmin roles
        if: steps.guard.outputs.skip != 'true'
        run: |
          PGPASSWORD=adminprop psql -h localhost -U adminprop -d adminprop_test <<'SQL'
          CREATE ROLE adminprop_app LOGIN PASSWORD 'adminprop';
          CREATE ROLE adminprop_superadmin LOGIN PASSWORD 'adminprop' BYPASSRLS;
          GRANT CONNECT ON DATABASE adminprop_test TO adminprop_app, adminprop_superadmin;
          GRANT USAGE ON SCHEMA public TO adminprop_app, adminprop_superadmin;
          ALTER DEFAULT PRIVILEGES IN SCHEMA public
            GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO adminprop_app, adminprop_superadmin;
          ALTER DEFAULT PRIVILEGES IN SCHEMA public
            GRANT USAGE, SELECT ON SEQUENCES TO adminprop_app, adminprop_superadmin;
          SQL

      - name: Run Alembic migrations
        if: steps.guard.outputs.skip != 'true'
        run: alembic upgrade head

      - name: Run integration tests (including tenant isolation)
        if: steps.guard.outputs.skip != 'true'
        # --cov-fail-under=0 overrides pyproject.toml's coverage gate: this job
        # only exercises tests/integration, so its own coverage is always well
        # under the global threshold. The real threshold is enforced on
        # combined coverage by coverage-gate.
        run: pytest tests/integration -v --cov=src/adminprop --cov-report=xml --cov-fail-under=0
        env:
          COVERAGE_FILE: .coverage.integration

      - name: Verify tenant isolation tests ran
        if: steps.guard.outputs.skip != 'true'
        run: |
          # Las suites test_tenant_isolation.py son OBLIGATORIAS
          # Si no hubo ningún test con esa palabra clave, el CI falla
          COUNT=$(pytest tests/integration --collect-only -q 2>/dev/null | grep -c "tenant_isolation" || true)
          if [ "$COUNT" -eq 0 ]; then
            echo "❌ No se encontraron tests de tenant_isolation"
            exit 1
          fi
          echo "✓ $COUNT tests de tenant_isolation registrados"

      - name: Upload coverage
        if: always() && steps.guard.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-integration
          include-hidden-files: true
          path: |
            .coverage.integration
            coverage.xml

  # ── Cobertura combinada ────────────────────────────────────────────────────────
  # pyproject.toml exige el umbral global (CLAUDE.md §3), pero unit-tests e
  # integration-tests corren en VMs separadas — cada una solo ve una fracción
  # del código, así que el gate real solo tiene sentido sobre la suma de ambas.
  coverage-gate:
    name: Combined coverage
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]
    steps:
      - uses: actions/checkout@v4

      - name: Skip si el proyecto aún no está scaffoldeado
        id: guard
        run: |
          if [ ! -f pyproject.toml ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "Proyecto sin scaffolding todavía — CI en no-op"
          fi

      - name: Set up Python
        if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install coverage
        if: steps.guard.outputs.skip != 'true'
        run: pip install coverage

      - name: Download unit coverage data
        if: steps.guard.outputs.skip != 'true'
        uses: actions/download-artifact@v4
        with:
          name: coverage-unit

      - name: Download integration coverage data
        if: steps.guard.outputs.skip != 'true'
        # integration-tests puede saltearse mientras no existan tests de
        # integracion — en ese caso no hay artifact y no es un error.
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: coverage-integration

      - name: Combine and enforce coverage threshold
        if: steps.guard.outputs.skip != 'true'
        run: |
          coverage combine $(ls .coverage.unit .coverage.integration 2>/dev/null)
          coverage report -m --fail-under=95

  # ── Verificación de cobertura SDD (CA-XX → test) ──────────────────────────────
  sdd-coverage:
    name: SDD Acceptance Criteria coverage
    runs-on: ubuntu-latest
    needs: integration-tests
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Skip si el proyecto aún no está scaffoldeado
        id: guard
        run: |
          if [ ! -f pyproject.toml ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "Proyecto sin scaffolding todavía — CI en no-op"
          fi

      - name: Extract CA-XX IDs from PR body
        id: extract
        if: steps.guard.outputs.skip != 'true'
        run: |
          # El body del PR (Fase 4.3 del session-start.md) lista CA-XX cubiertos
          # Patrón: "CA-XX-NN: descripción"
          gh pr view ${{ github.event.pull_request.number }} \
            --repo ${{ github.repository }} \
            --json body --jq .body \
            > /tmp/pr_body.md

          CAS=$(grep -oE 'CA-[A-Z0-9]+-[0-9]+' /tmp/pr_body.md | sort -u || true)
          echo "Found CAs in PR body: $CAS"
          echo "$CAS" > /tmp/expected_cas.txt
          echo "count=$(wc -l < /tmp/expected_cas.txt)" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify each CA-XX has corresponding test
        if: steps.guard.outputs.skip != 'true' && steps.extract.outputs.count != '0'
        run: |
          set -e
          MISSING=()
          while IFS= read -r CA; do
            [ -z "$CA" ] && continue
            # Buscar el ID del CA en nombres de tests (lower case: ca_xx_nn)
            CA_LOWER=$(echo "$CA" | tr '[:upper:]' '[:lower:]' | tr '-' '_')
            if ! grep -r "def test_${CA_LOWER}" tests/ > /dev/null 2>&1; then
              MISSING+=("$CA")
            fi
          done < /tmp/expected_cas.txt

          if [ ${#MISSING[@]} -gt 0 ]; then
            echo "❌ Los siguientes CA-XX no tienen test correspondiente:"
            printf '  - %s\n' "${MISSING[@]}"
            echo ""
            echo "Convención: el nombre del test debe contener el CA en lowercase con underscore."
            echo "Ejemplo: CA-RF02-01 → test_rf02_01_..."
            exit 1
          fi
          echo "✓ Todos los CA-XX del PR tienen test correspondiente"

  # ── Validación de Dockerfile (sin push) ──────────────────────────────────────
  docker-build:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - name: Skip si aún no existen los Dockerfiles
        id: guard
        run: |
          if [ ! -f docker/Dockerfile.api ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "Sin Dockerfiles todavía — job en no-op (llegan con el issue #2)"
          fi

      - name: Set up Docker Buildx
        if: steps.guard.outputs.skip != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build API image (no push)
        if: steps.guard.outputs.skip != 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.api
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: adminprop-back-api:ci-${{ github.sha }}

      - name: Build worker image (no push)
        if: steps.guard.outputs.skip != 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.worker
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: adminprop-back-worker:ci-${{ github.sha }}
