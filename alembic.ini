; alembic.ini — configuracion de Alembic para adminprop-back.
; docs/skills/database-migration.md: migraciones en
; src/adminprop/db/migrations/versions/, naming YYYYMMDD_HHMMSS_<slug>.py.
; sqlalchemy.url NO se fija aca: `db/migrations/env.py` lo toma de
; adminprop.config.get_settings().database_url (DATABASE_URL de entorno),
; para no duplicar configuracion entre local/CI/produccion.

[alembic]
script_location = src/adminprop/db/migrations
version_path_separator = os
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d%%(second).2d_%%(slug)s

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %%(levelname)-5.5s [%%(name)s] %%(message)s
datefmt = %%H:%%M:%%S
