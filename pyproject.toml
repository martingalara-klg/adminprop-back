[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "adminprop-backend"
version = "0.1.0"
description = "AdminProp — API de gestion de alquileres para administradoras de propiedades"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic-settings>=2.2",
    "python-json-logger>=2.0.7",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg2-binary>=2.9",
    "asyncpg>=0.29",
    # issue #4 — Celery/Redis workers (notification_worker, documents_worker,
    # Beat) + cliente HTTP para Resend (docs/skills/async-worker.md,
    # docs/skills/external-integrations.md).
    "celery[redis]>=5.3",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "pyyaml>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/adminprop"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["src/adminprop"]

[tool.coverage.report]
# CLAUDE.md §3: cobertura minima 95% (excluye boilerplate trivial)
fail_under = 95
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
