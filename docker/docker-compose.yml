name: adminprop-back

# Referencias:
# - CLAUDE.md §3 "Stack de backend" — Postgres 16, Redis 7, Celery 5.
# - docs/runbooks/RUNBOOK-LOCAL-001-backend.md — comandos make up/migrate/test.
# - docs/sdd/core/sdd_04_nonfunctional.md §3.1 — ambiente local: Postgres 16 +
#   Redis 7 + API + workers.
#
# Decisión de implementación (issue #2): los workers Celery
# (notification_worker, documents_worker, beat — CLAUDE.md §3 y
# sdd_04 §1.3) todavía no existen en el código; llegan con el issue #4.
# Se declaran acá bajo el profile "workers" (desactivado por default) para
# que `docker compose up` (sin --profile) levante sólo lo operativo hoy
# (postgres, redis, api) sin fallar por un comando/módulo Celery inexistente.
# Se activan explícitamente con:
#   docker compose -f docker/docker-compose.yml --profile workers up

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: adminprop
      POSTGRES_PASSWORD: adminprop
      POSTGRES_DB: adminprop
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adminprop -d adminprop"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    environment:
      ENVIRONMENT: local
      LOG_LEVEL: INFO
      DATABASE_URL: postgresql://adminprop:adminprop@postgres:5432/adminprop
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../src:/app/src
      - ../tests:/app/tests
    command: ["uvicorn", "adminprop.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  # --- Workers Celery (issue #4 — no implementados todavía) -----------------
  # Servicios declarados para que el compose ya documente la topología final
  # (CLAUDE.md §9), pero desactivados por default vía profile "workers" hasta
  # que src/adminprop/workers/celery_app.py exista.
  notification_worker:
    profiles: ["workers"]
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
    environment:
      ENVIRONMENT: local
      LOG_LEVEL: INFO
      DATABASE_URL: postgresql://adminprop:adminprop@postgres:5432/adminprop
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../src:/app/src
    command: ["celery", "-A", "adminprop.workers.celery_app", "worker", "-Q", "notifications", "--loglevel=info"]

  documents_worker:
    profiles: ["workers"]
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
    environment:
      ENVIRONMENT: local
      LOG_LEVEL: INFO
      DATABASE_URL: postgresql://adminprop:adminprop@postgres:5432/adminprop
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../src:/app/src
    command: ["celery", "-A", "adminprop.workers.celery_app", "worker", "-Q", "documents", "--loglevel=info"]

  beat:
    profiles: ["workers"]
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
    environment:
      ENVIRONMENT: local
      LOG_LEVEL: INFO
      DATABASE_URL: postgresql://adminprop:adminprop@postgres:5432/adminprop
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../src:/app/src
    command: ["celery", "-A", "adminprop.workers.celery_app", "beat", "--loglevel=info"]

volumes:
  postgres_data:
  redis_data:
